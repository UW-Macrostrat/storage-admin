[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[project]
name = "htpheno.radosgw-admin-client"
version = "0.9.0"
description = "Client for the Ceph Object Gateway Admin Operations API"
authors = [{ name = "Brian Aydemir", email = "baydemir@morgridge.org" }]
requires-python = ">=3.9,<4.0"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "humanize>=4.11,<4.12",
    "radosgw-admin>=1.7,<1.8",
]

[project.urls]
Repository = "https://github.com/HTPhenotyping/radosgw_admin_client"

[project.scripts]
radosgw-admin-client = "htpheno.radosgw_admin_client:entrypoint"

[dependency-groups]
dev = [
    "bandit>=1.7,<1.8",
    "black>=24.10,<24.11",
    "isort>=5.13,<5.14",
    "markdown>=3.7,<3.8",
    "mypy>=1.12,<1.13",
    "pre-commit>=4.0,<4.1",
    "pylint>=3.3,<3.4",
]


[tool.black]
line-length = 96
target-version = ["py39", "py310", "py311", "py312"]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["htpheno"]
module-root = ""
namespace = true


[tool.isort]
line_length = 96
profile = "black"


[tool.mypy]
explicit_package_bases = true
namespace_packages = true

check_untyped_defs = true
strict_optional = true
no_implicit_optional = true

warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

color_output = false
pretty = true
show_error_codes = true

incremental = true
sqlite_cache = true


[tool.pylint.messages-control]
max-line-length = 96
disable = "invalid-name,missing-class-docstring,missing-function-docstring"
